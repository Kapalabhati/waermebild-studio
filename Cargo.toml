[package]
name = "waermebild-studio"
version = "0.5.0"
edition = "2021"
description = "Desktop-App für USB-Wärmebildkameras: Live-Bild, Messpunkte, Temperaturverlauf, Rohdaten, Foto/Intervall/Video"

[[bin]]
name = "waermebild-studio"
path = "src/main.rs"

[dependencies]
eframe = "0.37"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
nokhwa = { version = "0.10", default-features = false, features = ["input-msmf"] }
chrono = "0.4"
ab_glyph = "0.2"
epaint_default_fonts = "0.37"
rfd = "0.17"
getrandom = "0.2"
rusb = { version = "0.9", features = ["vendored"] }
libusb1-sys = { version = "0.7", features = ["vendored"] }
libc = "0.2"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
